name: Build EPUB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-epub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Java for EPUBCheck
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Pandoc and EPUBCheck
        run: python3 scripts/setup_tools.py --epubcheck

      - name: Build and validate EPUB
        run: ./package.sh --epubcheck

      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Upload EPUB
        id: epub
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: output/usa-birth.epub
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add download link to summary
        env:
          EPUB_DOWNLOAD_URL: ${{ steps.epub.outputs.artifact-url }}
        run: printf '[下載 EPUB](%s)（保留 30 天）\n' "$EPUB_DOWNLOAD_URL" >> "$GITHUB_STEP_SUMMARY"
